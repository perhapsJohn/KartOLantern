<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="theme-color" content="#120d1c">
		<title>Kart-o'-Lantern</title>
		<!-- Kart-o'-Lantern web shell (web/shell.html, the Web preset's custom_html_shell).
		     The game's night palette (data/main/edition.json): loading, the turn-sideways
		     card and the first frame read as one thing, in the Scareathon arcade iframe or
		     alone. One page, two packs: phones load index.mobile.pck, desktops index.pck
		     (tools/web_build.py fills in KOL_MOBILE_PCK_SIZE). The loading screen is the
		     painted key art (index.bg.webp, from ui/menu_bg.png) under the logo, the same
		     art the title shows on its first frame, and it stays up until the game says it
		     has drawn that frame (window.koGameShown, ui/screens/title.gd): never black. -->
		<link rel="preload" href="index.bg.webp" as="image">
		<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
html, body { width: 100%; height: 100%; }
body {
	background: #120d1c;
	color: #fff3e0;
	overflow: hidden;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	overscroll-behavior: none;
	font-family: 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
}
#canvas { display: block; touch-action: none; }
#canvas:focus { outline: none; }
.cover {
	position: absolute; inset: 0;
	display: flex; flex-direction: column; justify-content: center; align-items: center;
	gap: 0.7rem; text-align: center; padding: 1rem; box-sizing: border-box;
	background: radial-gradient(ellipse at 50% 112%, #5a2a14 0%, #2a1638 38%, #120d1c 72%);
}
#status { visibility: hidden; z-index: 4; transition: opacity 0.45s ease-out; }
#status, #lost {
	background:
		linear-gradient(180deg, rgba(18, 13, 28, 0.05) 0%, rgba(18, 13, 28, 0.35) 62%, rgba(18, 13, 28, 0.8) 100%),
		url('index.bg.webp') center / cover no-repeat,
		radial-gradient(ellipse at 50% 112%, #5a2a14 0%, #2a1638 38%, #120d1c 72%);
}
#status.leaving { opacity: 0; pointer-events: none; }
#status > * { transition: opacity 0.15s ease-out; }
#status.leaving > * { opacity: 0; }  /* the logo goes first: the title draws its own at the top */
#status-logo { width: min(78vw, 540px, 112vh); height: auto; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.6)); }
#status-title { display: none; font-weight: 900; font-size: clamp(2rem, 9vw, 3.6rem); color: #ff7a1a; }
#status-tag { color: #e6d9f2; font-size: clamp(0.85rem, 3.4vw, 1.05rem); text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9); }
#status-bar {
	width: min(60vw, 320px); height: 10px; margin-top: 0.3rem;
	border-radius: 999px; background: rgba(0, 0, 0, 0.45); overflow: hidden;
	box-shadow: 0 0 0 2px rgba(255, 122, 26, 0.25);
	display: none;
}
#status-fill {
	height: 100%; width: 0%;
	background: linear-gradient(90deg, #ff7a1a, #ffc94a);
	border-radius: 999px;
	transition: width 0.2s ease-out;
}
#status-fill.indeterminate { width: 35%; animation: slide 1.2s ease-in-out infinite alternate; }
@keyframes slide { from { margin-left: 0%; } to { margin-left: 65%; } }
#status-notice {
	display: none;
	background: #fff3e0; color: #241634;
	border-radius: 14px; line-height: 1.45;
	max-width: 30rem; padding: 1rem 1.25rem;
	box-shadow: 0 6px 14px rgba(0, 0, 0, 0.45);
}
#status-splash { display: none; }
#lost { display: none; z-index: 6; }
#lost.show { display: flex; }
#lost img { width: min(60vw, 420px, 80vh); height: auto; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.6)); }
#lost-tag { max-width: 26rem; line-height: 1.45; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9); }
#lost button {
	font: inherit; font-weight: 800; color: #241634; background: #ffc94a;
	border: 0; border-radius: 999px; padding: 0.6rem 1.4rem; cursor: pointer;
	box-shadow: 0 4px 0 #b4561a;
}
#lost button:hover { background: #ffd877; }
#lost button:active { transform: translateY(3px); box-shadow: 0 1px 0 #b4561a; }
#turn { display: none; z-index: 5; }
#turn.show { display: flex; }
#turn svg { width: 92px; height: 92px; }
#turn-title { font-weight: 800; font-size: 1.35rem; color: #ffc94a; }
#turn-tag { color: #b9a7c9; font-size: 0.95rem; max-width: 18rem; }
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
		<noscript>Kart-o'-Lantern needs JavaScript.</noscript>
		<div id="status" class="cover">
			<img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="index.png" alt="">
			<img id="status-logo" src="index.logo.webp" alt="Kart-o'-Lantern" onerror="this.remove(); document.getElementById('status-title').style.display = 'block';">
			<div id="status-title">Kart-o'-Lantern</div>
			<div id="status-tag">Lighting the lanterns along the track&hellip;</div>
			<div id="status-bar"><div id="status-fill"></div></div>
			<div id="status-notice"></div>
		</div>
		<div id="lost" class="cover" role="alert">
			<img src="index.logo.webp" alt="Kart-o'-Lantern">
			<div id="lost-tag">The lanterns blew out: this browser stopped the game's graphics (its WebGL context was lost).</div>
			<button type="button" onclick="location.reload()">Light them again</button>
		</div>
		<div id="turn" class="cover" aria-live="polite">
			<svg viewBox="0 0 92 92" aria-hidden="true">
				<rect x="28" y="10" width="36" height="62" rx="7" fill="none" stroke="#b9a7c9" stroke-width="4" stroke-dasharray="6 5"/>
				<rect x="12" y="34" width="62" height="36" rx="7" fill="#241634" stroke="#ff7a1a" stroke-width="4"/>
				<circle cx="66" cy="52" r="3" fill="#ff7a1a"/>
				<path d="M70 18 a22 22 0 0 1 10 22" fill="none" stroke="#ffc94a" stroke-width="4" stroke-linecap="round"/>
				<path d="M74 40 l6 1 l2 -6" fill="none" stroke="#ffc94a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
			</svg>
			<div id="turn-title">Turn your phone sideways</div>
			<div id="turn-tag">Steer with your left thumb; drift and throw items with your right.</div>
		</div>

		<script>
// Audio unlock. Browsers keep audio suspended until a user gesture, and iOS
// Safari only lets it start *inside* one. The engine creates its AudioContext
// (GodotAudio.ctx) out of reach, so the constructor is wrapped here, before the
// engine loads, and every instance is recorded. Each tap / click / key then,
// synchronously in the handler:
//   * on iOS, sets navigator.audioSession to "playback" (iOS 17+) and plays a
//     silent looping <audio>, so the ring/silent switch does not mute the game;
//   * resumes every context that is not running.
// window.koAudioUnlocked turns true once a gesture has run them all;
// core/audio.gd polls it and restarts the requested music then, so the title's
// first input ("Tap to start" / any key) is the moment the menu music starts.
// The listeners stay: iOS suspends ("interrupted") on calls and app switches.
(function () {
	const AC = window.AudioContext || window.webkitAudioContext;
	const ctxs = [];
	const ua = navigator.userAgent;
	const IOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
	let gestured = false;
	let tag = null;
	window.koAudioUnlocked = false;
	window.koAudioContexts = ctxs;  // read by the page checks (tools/web_audio_check.mjs)
	function update() {
		const live = ctxs.filter((c) => c.state !== 'closed');
		if (gestured && live.length > 0 && live.every((c) => c.state === 'running')) {
			window.koAudioUnlocked = true;
		}
	}
	if (AC) {
		const Wrapped = function (...args) {
			const c = new AC(...args);
			ctxs.push(c);
			c.addEventListener('statechange', update);
			return c;
		};
		Wrapped.prototype = AC.prototype;
		window.AudioContext = Wrapped;
		if (window.webkitAudioContext) { window.webkitAudioContext = Wrapped; }
	}
	// 0.5 s of 8-bit silence (a WAV built here: no extra file to fetch)
	function silentWav() {
		const rate = 8000, n = 4000, v = new DataView(new ArrayBuffer(44 + n));
		const str = (o, t) => { for (let i = 0; i < t.length; i++) { v.setUint8(o + i, t.charCodeAt(i)); } };
		str(0, 'RIFF'); v.setUint32(4, 36 + n, true); str(8, 'WAVE'); str(12, 'fmt ');
		v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
		v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
		str(36, 'data'); v.setUint32(40, n, true);
		for (let i = 0; i < n; i++) { v.setUint8(44 + i, 128); }
		return URL.createObjectURL(new Blob([v.buffer], { type: 'audio/wav' }));
	}
	function playbackSession() {
		if (!IOS || document.hidden) { return; }
		try { if (navigator.audioSession) { navigator.audioSession.type = 'playback'; } } catch (e) { /* older iOS */ }
		if (!tag) {
			tag = document.createElement('audio');
			tag.setAttribute('playsinline', '');
			tag.setAttribute('x-webkit-airplay', 'deny');
			tag.disableRemotePlayback = true;
			tag.loop = true;
			tag.preload = 'auto';
			tag.src = silentWav();
		}
		if (tag.paused) { const p = tag.play(); if (p) { p.catch(() => {}); } }
	}
	function unlock(ev) {
		if (ev && ev.isTrusted === false) { return; }
		playbackSession();
		if (ctxs.length > 0) { gestured = true; }
		ctxs.forEach((c) => {
			if (c.state !== 'running' && c.state !== 'closed') {
				const p = c.resume();
				if (p) { p.then(update, () => {}); }
			}
		});
		update();
	}
	['pointerdown', 'pointerup', 'mousedown', 'touchstart', 'touchend', 'click', 'keydown'].forEach((e) =>
		window.addEventListener(e, unlock, { capture: true, passive: true }));
	// the silent loop would show in the lock screen's player: pause it while hidden
	document.addEventListener('visibilitychange', () => {
		if (document.hidden) {
			if (tag && !tag.paused) { tag.pause(); }
		} else if (gestured) {
			playbackSession();
			ctxs.forEach((c) => { if (c.state !== 'running' && c.state !== 'closed') { c.resume().catch(() => {}); } });
		}
	});
}());

// Phones and tablets get the phone pack, the turn-sideways card and a capped
// pixel ratio (a 3x screen would render the 3D at 9x the pixels for little
// gain). ?pack=mobile / ?pack=desktop forces a pack (testing).
const KOL_QUERY = new URLSearchParams(location.search);
const KOL_PHONE = (function () {
	const forced = KOL_QUERY.get('pack');
	if (forced === 'mobile' || forced === 'desktop') { return forced === 'mobile'; }
	const ua = navigator.userAgent;
	return /iPhone|iPad|iPod|Android/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)
		|| window.matchMedia('(pointer: coarse) and (max-height: 1100px)').matches;
}());
(function () {
	const real = window.devicePixelRatio || 1;
	const cap = KOL_PHONE ? 1.5 : 2;
	if (real > cap) {
		try { Object.defineProperty(window, 'devicePixelRatio', { get: () => cap, configurable: true }); } catch (e) { /* keep the real one */ }
	}
}());
		</script>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":58170636,"index.wasm":37686550},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const KOL_PACK = KOL_PHONE ? 'index.mobile.pck' : 'index.pck';  // phones never download the desktop pack
if (GODOT_CONFIG.fileSizes && '49436876' !== 'KOL_' + 'MOBILE_PCK_SIZE') {
	GODOT_CONFIG.fileSizes['index.mobile.pck'] = Number('49436876');
}
// The page URL carries the game's dev flags for scripted checks, e.g.
// ?race=graveyard&mode=gp&autodrive=1&laps=1 (ui/app.gd, race/race.gd, core/arcade.gd);
// ?room=CODE is an invite (addons/online_mp reads it itself).
const KOL_ARGS = (function () {
	const allowed = ['screen', 'race', 'mode', 'cc', 'players', 'autodrive', 'no-intro', 'time-scale', 'laps', 'unlock-all', 'touch', 'no-attract'];
	const user = [];
	for (const k of allowed) {
		if (KOL_QUERY.has(k)) { user.push('--' + k + '=' + (KOL_QUERY.get(k) || '1')); }
	}
	const engineArgs = KOL_QUERY.get('verbose') ? ['--verbose'] : [];
	return user.length ? engineArgs.concat(['--'], user) : engineArgs;
}());
const engine = new Engine(GODOT_CONFIG);

(function () {
	const overlay = document.getElementById('status');
	const bar = document.getElementById('status-bar');
	const fill = document.getElementById('status-fill');
	const notice = document.getElementById('status-notice');
	const turn = document.getElementById('turn');
	let initializing = true;
	let mode = '';

	function setMode(m) {
		if (mode === m || !initializing) { return; }
		if (m === 'hidden') {
			// fade out over the game's first frame (the same key art), then go
			initializing = false;
			overlay.classList.add('leaving');
			setTimeout(() => overlay.remove(), 600);
			return;
		}
		overlay.style.visibility = 'visible';
		bar.style.display = m === 'progress' ? 'block' : 'none';
		notice.style.display = m === 'notice' ? 'block' : 'none';
		mode = m;
	}

	function fail(err) {
		console.error(err);
		const text = err instanceof Error ? err.message : (typeof err === 'string' ? err : 'The karts would not start.');
		notice.textContent = '';
		text.split('\n').forEach((line) => { notice.appendChild(document.createTextNode(line)); notice.appendChild(document.createElement('br')); });
		setMode('notice');
		initializing = false;
	}

	// A landscape game: on a phone held upright, ask for it sideways.
	function checkTurn() {
		turn.classList.toggle('show', KOL_PHONE && window.innerHeight > window.innerWidth * 1.05);
	}
	window.addEventListener('resize', checkTurn);
	window.addEventListener('orientationchange', checkTurn);
	checkTurn();

	// The browser can drop the WebGL context (GPU reset, memory pressure; the
	// engine cannot rebuild it): show the key art and a reload, never a black page.
	document.getElementById('canvas').addEventListener('webglcontextlost', () => {
		document.getElementById('lost').classList.add('show');
	});

	// Keep keyboard focus on the game after taps on the page.
	document.addEventListener('pointerdown', () => {
		const c = document.getElementById('canvas');
		if (c && document.activeElement !== c) { c.focus(); }
	}, true);
	// The page itself never zooms (pinch, double-tap) or scrolls.
	document.addEventListener('gesturestart', (e) => e.preventDefault());
	document.addEventListener('dblclick', (e) => e.preventDefault());
	document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) { e.preventDefault(); } }, { passive: false });

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('This browser is missing features the game needs:\n' + missing.join('\n') + '\nTry a current Chrome, Edge, Firefox or Safari.');
		return;
	}
	setMode('progress');
	engine.startGame({
		mainPack: KOL_PACK,
		args: KOL_ARGS,
		onProgress: function (current, total) {
			if (current > 0 && total > 0) {
				fill.classList.remove('indeterminate');
				fill.style.width = Math.min(100, (100 * current) / total).toFixed(1) + '%';
			} else {
				fill.classList.add('indeterminate');
			}
		},
	}).then(() => {
		// the engine runs; the title calls koGameShown once it has drawn the key
		// art (a dev ?screen= / ?race= start never does: hand over after a moment)
		bar.style.display = 'none';
		setTimeout(() => setMode('hidden'), 4000);
	}, fail);
	window.koGameShown = () => setMode('hidden');
}());
		</script>
	</body>
</html>
